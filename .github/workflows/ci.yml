name: CI

# Every pull request, Dependabot's included. ci-ok is the single check main requires: it fails if any
# job below failed or was cancelled, so Dependabot's auto-merge only lands a green run.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/generated/posts.json is gitignored and written by the content fetch; the type check imports it
      - name: Fetch content
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID || '4qw0kd9q' }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET || 'production' }}
        run: pnpm prebuild

      - name: Sanity typegen drift check
        run: |
          pnpm typegen
          git diff --exit-code src/generated/sanity.types.ts || (echo "::error::Schema or GROQ query changed without regenerating types. Run pnpm typegen and commit the result." && exit 1)

      # The root tsconfig only references the app and node projects, so -b is what actually checks them
      - name: TypeScript
        run: pnpm exec tsc -b

      - name: Biome
        run: pnpm exec biome ci .

      - name: Studio ESLint
        run: pnpm --filter @whoami/studio exec eslint .

  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The project and dataset are public (they're in studio/sanity.config.ts and every image URL), so
      # Dependabot's pull requests, which can't read Actions secrets, still build against real content
      - name: Build website
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID || '4qw0kd9q' }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET || 'production' }}
        run: pnpm build

      - name: Authoring leak check
        run: pnpm check:leaks

  studio:
    name: build studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @whoami/studio...

      - name: Build studio
        run: pnpm --filter @whoami/studio exec sanity build --yes

  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build-and-deploy.yml'

  # Read-only plan before merge, since a merge to main applies. Dependabot runs get no secrets or
  # OIDC token, so its Terraform bumps (merged by hand) skip this.
  infra-plan:
    name: infra plan
    needs: changes
    if: needs.changes.outputs.infra == 'true' && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-2

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config=backend.conf
      - run: terraform validate

      # The plan role is read-only and cannot take the DynamoDB state lock
      - name: terraform plan
        run: |
          terraform plan -input=false -no-color -lock=false -out=tfplan
          terraform show -no-color tfplan > tfplan.txt
          {
            echo "<!-- terraform-plan -->"
            echo "### Terraform plan"
            echo
            grep -E '^(Plan:|No changes\.)' tfplan.txt || echo 'No changes.'
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```hcl'
            head -c 60000 tfplan.txt
            echo '```'
            echo '</details>'
          } > plan.md
          cat plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q '.[] | select(.user.type == "Bot" and (.body | startswith("<!-- terraform-plan -->"))) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@plan.md >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@plan.md >/dev/null
          fi

  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, build, studio, changes, infra-plan]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed."
