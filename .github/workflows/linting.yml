name: Linting

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:

jobs:
  lint:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Sanity typegen drift check
        run: |
          pnpm typegen
          git diff --exit-code src/generated/sanity.types.ts || (echo "::error::Schema or GROQ query changed without regenerating types. Run pnpm typegen and commit the result." && exit 1)

      - name: TypeScript Check
        run: pnpm tsc --noEmit

      - name: Biome Check
        uses: biomejs/setup-biome@v2
        with:
          version: 2.4.8

      - name: Run Biome
        run: biome ci .
