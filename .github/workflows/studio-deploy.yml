name: Studio Deploy

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
  workflow_dispatch:

concurrency:
  group: studio-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --filter @whoami/studio...

      - name: Deploy hosted studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: pnpm --filter @whoami/studio exec sanity deploy -y
