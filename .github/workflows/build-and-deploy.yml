name: Build & Deploy

on:
  push:
    branches: [main]
    # Studio changes deploy through studio-deploy.yml and don't affect the site build
    paths-ignore:
      - "studio/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build website
        id: build
        env:
          VITE_GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID }}
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: |
          pnpm build
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Authoring leak check
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: pnpm check:leaks

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  infrastructure:
    needs: build
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.3"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init -backend-config=backend.conf

      - name: Terraform Plan
        working-directory: ./infra
        run: terraform plan -out=tfplan
        env:
          TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERTIFICATE_ARN }}

      - name: Terraform Apply
        working-directory: ./infra
        run: terraform apply -auto-approve tfplan

  deploy:
    needs: infrastructure
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy to S3
        # Hashed assets never change, so browsers and CloudFront may keep them for a year.
        # Old hashes stay (no --delete) so a tab still on the previous HTML can load its chunks.
        # Everything else (HTML, feed, sitemap, robots, public/) is revalidated on every request.
        run: |
          aws s3 sync dist/assets s3://felix-hzv.dev/assets \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ s3://felix-hzv.dev --delete --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/" "/index.html" "/blog/*" "/rss.xml" "/sitemap.xml" "/robots.txt"
